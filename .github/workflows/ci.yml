name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests tools experiments

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # Installed without the train extra on purpose: the default path must
      # work on a machine that has never seen a training framework, and a heavy
      # optional dependency on the build machine is how a broken import hides.
      - run: pip install -e ".[dev]"
      - name: Tests
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=inference_unit_economics \
            --cov-report=json:reports/coverage.json \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term
      - name: Coverage floor
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          floor = 95.0
          rate = float(ET.parse("reports/coverage.xml").getroot().get("line-rate")) * 100
          print(f"line coverage {rate:.2f}% against a floor of {floor}%")
          raise SystemExit(0 if rate >= floor else 1)
          PY
      - name: The published test count is the collected count
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          root = ET.parse("reports/junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          collected = int(suite.get("tests", 0))
          published = json.load(open("docs/metrics.json"))["metrics"]["tests_total"]
          print(f"collected {collected}, published {published}")
          raise SystemExit(0 if collected == published else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/

  receipts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Regenerate the Terraform and check it is unchanged
        run: |
          python -m inference_unit_economics.tfgen.generate
          git diff --exit-code terraform/
      - name: Tests, as their own step so a red test reads as a red test
        run: |
          mkdir -p reports
          python -m pytest -q --junitxml=reports/junit.xml \
            --cov=inference_unit_economics --cov-report=json:reports/coverage.json
      - name: Re-measure every published figure
        run: python tools/collect_metrics.py --skip-tests
      - name: Check the documents against the code
        run: python tools/check_numbers.py
      - name: Check that no duration is published as a result
        run: python tools/check_durations.py
      - name: Check every local README image resolves, offline
        run: |
          python -m playwright install --with-deps chromium
          python tools/check_readme_render.py
      - name: Check the committed metrics are the ones just measured
        run: git diff --exit-code docs/metrics.json
      - name: Prove the checker catches a stale figure
        run: python tools/check_numbers.py --prove
      - name: Publish the uncomfortable table to the job summary
        if: always()
        run: python tools/job_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiments
          path: docs/experiments/

  # Optional and non blocking. Rebuilds the model fixture with the train extra
  # and checks the committed artifact still matches its manifest's hash chain:
  # the exporter's bytes may drift across versions, which is exactly what the
  # manifest exists to pin, so this job reports rather than gates.
  model-rebuild:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,train]"
      - name: Rebuild the fixture and report any byte drift
        run: |
          python -m inference_unit_economics.model.build > /dev/null
          git diff --stat fixtures/model/ || true
          git diff --exit-code fixtures/model/model.onnx \
            && echo "exporter reproduced the committed bytes" \
            || echo "exporter version drift: the committed manifest still pins the artifact in use"
