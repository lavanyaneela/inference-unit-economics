[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-unit-economics"
version = "1.0.0"
description = "Finds the traffic volume where each inference placement stops being the cheap one."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lavanya Neela", email = "lavanyaneela@mycvcareer.com" }]
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-hcl2>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "cmarkgfm>=2024.1",
    "playwright>=1.40",
]
# Only needed to regenerate fixtures/model/model.onnx. The default path loads the
# committed model and never imports a training framework.
train = [
    "scikit-learn>=1.4",
    "skl2onnx>=1.16",
]

[project.scripts]
iue = "inference_unit_economics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inference_unit_economics = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["B008"]

[tool.coverage.run]
# model/build.py needs the train extra and runs only when the fixture is rebuilt.
# Counting a deliberately-off-the-default-path module in the denominator would
# publish a coverage figure unreachable in CI; the exclusion is disclosed in the
# README's reproduction section.
omit = ["src/inference_unit_economics/model/build.py"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "raise SystemExit"]
